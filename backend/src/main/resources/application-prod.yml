# Production Profile for LedgerLine
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 1MB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerline}?sslmode=${DB_SSLMODE:require}${DB_PARAMS:}
    username: ${APP_DB_USER:ledger_app}
    password: ${APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerline}?sslmode=${DB_SSLMODE:require}${DB_PARAMS:}
    user: ${DB_MIGRATION_USER:ledger_owner}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    placeholders:
      app_db_password: ${APP_DB_PASSWORD}

rate-limiting:
  trusted-proxy-enabled: ${TRUSTED_PROXY_ENABLED:true} # Render / Reverse proxy mode
  login-ip-capacity: ${LOGIN_IP_CAPACITY:10}
  login-user-capacity: ${LOGIN_USER_CAPACITY:5}
  money-user-capacity: ${MONEY_USER_CAPACITY:60}
