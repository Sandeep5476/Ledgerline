server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 1MB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: ledgerline-backend

  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerline}${DB_PARAMS:}
    username: ${APP_DB_USER:ledger_app}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerline}${DB_PARAMS:}
    user: ${DB_MIGRATION_USER:${DB_USER:ledger_owner}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
    locations: classpath:db/migration
    placeholders:
      app_db_password: ${APP_DB_PASSWORD:ledger_app_insecure_default}

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 1800000 # 30 minutes

seed:
  admin:
    password: ${SEED_ADMIN_PASSWORD:}
  holder:
    password: ${SEED_HOLDER_PASSWORD:}
  auditor:
    password: ${SEED_AUDITOR_PASSWORD:}
