# Netlify Configuration for LedgerLine Frontend
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# API Proxy: Forward API calls to the backend (e.g. Render / Railway)
# Once you deploy the backend, replace the target URL or set it in Netlify redirects:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-ledgerline-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
